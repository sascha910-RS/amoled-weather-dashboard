; LilyGo T-Display-S3 AMOLED 1.9" - Desk Dashboard
; ESP32-S3, 16 MB Flash, 8 MB PSRAM (OPI), RM67162 QSPI-AMOLED 536x240

[env:t-display-s3-amoled]
platform = espressif32@6.5.0
framework = arduino
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL sucht lv_conf.h ueber den Include-Pfad statt ueber ../
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -Os

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4
